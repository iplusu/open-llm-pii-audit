INT8: {method: "vLLM --quantization fp8", note: "native H100 8-bit class; vLLM 0.30 has no generic runtime BF16->INT8 cast, so INT8 is realised as FP8 (a bitsandbytes load_in_8bit fallback was configured if fp8 was unavailable)"}
