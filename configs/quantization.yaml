calibration: {file: data/quantization_calibration.jsonl, n_samples: 128, max_seq_len: 512, text: "first user turn of 128 distinct probes of the main suite", status: "reconstructed selection (first 128 by probe_id); see DATA_DICTIONARY.md and provenance/known_limitations.md L7"}
conditions_run: [C0, C5]
replaced_path: "runtime bitsandbytes 4-bit was attempted first and rejected by vLLM 0.30 for unquantized repos"
